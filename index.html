    <!-- Schema.org JSON-LD for Educational Product & FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Product",
          "name": "Kit Completo de Alfabetização Infantil",
          "description": "Atividades organizadas em sequência prática para crianças de 4 a 8 anos aprenderem a ler e escrever com confiança.",
          "category": "Educational Material",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "BRL",
            "lowPrice": "47.00",
            "highPrice": "67.00",
            "offerCount": "2"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Quais as formas de pagamento?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PIX e cartão de crédito."
              }
            },
            {
              "@type": "Question",
              "name": "Como recebo o material?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Por e-mail, logo após a confirmação do pagamento."
              }
            },
            {
              "@type": "Question",
              "name": "Preciso pagar mensalidade?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. O pagamento é único e o acesso é vitalício."
              }
            },
            {
              "@type": "Question",
              "name": "Posso usar no celular?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, no celular, tablet ou computador, e também dá para imprimir."
              }
            },
            {
              "@type": "Question",
              "name": "A compra é segura?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, o pagamento é processado em ambiente protegido."
              }
            },
            {
              "@type": "Question",
              "name": "Preciso saber ensinar para aplicar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. O passo a passo é guiado, e as atividades têm instruções claras para qualquer pai ou mãe."
              }
            },
            {
              "@type": "Question",
              "name": "A partir de que idade posso usar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Indicado para crianças de 4 a 8 anos. Comece pela etapa em que seu filho está."
              }
            },
            {
              "@type": "Question",
              "name": "E se meu filho não gostar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Você tem 7 dias de garantia. Se não funcionar para vocês, devolvemos o valor integral."
              }
            }
          ]
        }
      ]
    }
    </script>

  <body class="bg-amber-50/30 text-slate-800 antialiased selection:bg-teal-100 selection:text-teal-900 font-sans">
